[project]
name = "pytorch-template"
version = "0.1.0"
description = "Template for PyTorch training projects with a layered, port-based architecture"

authors = [
    {name = "Timur Çakmakoğlu", email = "t.cakmakoglu@tutanota.com"},
]
license = "MIT"
license-files = ["LICENSE"]

requires-python = ">=3.14"
dependencies = [
    "mlflow>=3.15.2",
    "polars>=1.44.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "torch>=2.13.0",
]

[project.scripts]
template-train = "template.cli.train:main"
template-infer = "template.cli.infer:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
src = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]
